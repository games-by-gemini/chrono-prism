<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  />
  <title>Chrono Prism</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --bg-deep: #070913;
      --accent-cyan: #22d3ee;
      --accent-magenta: #f43f5e;
      --accent-gold: #fbbf24;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 45%, #111833 0%, #070913 75%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 45%, #111833 0%, #070913 75%);
      pointer-events: none;
      transition: opacity 0.25s ease-out;
      z-index: 10;
    }

    #boot-loader.hidden {
      opacity: 0;
    }

    .prism-spinner {
      width: 56px;
      height: 56px;
      position: relative;
      animation: pulse-spin 2.4s infinite ease-in-out;
    }

    @keyframes pulse-spin {
      0% { transform: rotate(0deg) scale(0.95); filter: drop-shadow(0 0 10px #22d3ee); }
      50% { transform: rotate(180deg) scale(1.06); filter: drop-shadow(0 0 18px #f43f5e); }
      100% { transform: rotate(360deg) scale(0.95); filter: drop-shadow(0 0 10px #22d3ee); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" tabindex="0" aria-label="Chrono Prism Game Arena"></canvas>
  </div>
  <div id="boot-loader">
    <svg class="prism-spinner" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,10 90,82 10,82" stroke="#22d3ee" stroke-width="5" fill="rgba(34,211,238,0.12)" />
      <polygon points="50,24 76,74 24,74" stroke="#f43f5e" stroke-width="3" fill="rgba(244,63,94,0.10)" />
      <circle cx="50" cy="56" r="8" fill="#fbbf24" />
    </svg>
  </div>
  <script src="/arcadible/sdk/v1.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
